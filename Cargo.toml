[package]
name = "affine-desktop-mcp"
version = "0.2.0"
edition = "2024"
description = "Local MCP bridge for AFFiNE Desktop with offline native diagrams"
rust-version = "1.95"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sauravniraula/affine-desktop-mcp"
homepage = "https://github.com/sauravniraula/affine-desktop-mcp"
publish = ["crates-io"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "tests/**", "examples/**"]

# Preserve the existing Rust import path and native executable name.
[lib]
name = "affine_local_mcp"

[[bin]]
name = "affine-local-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
yrs = "0.28"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
base64 = "0.22"
sha2 = "0.11"
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mime_guess = "2"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
