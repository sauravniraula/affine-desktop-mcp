[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affine-desktop-mcp"
dynamic = ["version"]
description = "Local stdio MCP bridge for AFFiNE Desktop with offline native diagrams"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["affine", "mcp", "desktop", "notes", "diagrams"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/sauravniraula/affine-desktop-mcp"
Repository = "https://github.com/sauravniraula/affine-desktop-mcp"
Issues = "https://github.com/sauravniraula/affine-desktop-mcp/issues"

[project.scripts]
affine-desktop-mcp = "affine_desktop_mcp:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["affine_desktop_mcp"]
